      # -------------------------------------------------------
      # VERIFY PODS
      # -------------------------------------------------------

      - name: Verify Pods
        run: |
          kubectl get pods \
            -n pulseops \
            -o wide


      # -------------------------------------------------------
      # VERIFY SERVICES
      # -------------------------------------------------------

      - name: Verify Services
        run: |
          kubectl get svc \
            -n pulseops


      # -------------------------------------------------------
      # VERIFY INGRESS
      # -------------------------------------------------------

      - name: Verify Ingress
        run: |
          kubectl get ingress \
            -n pulseops


      # -------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # -------------------------------------------------------

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n pulseops -o wide || true

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n pulseops || true

          echo "========== SERVICES =========="
          kubectl get svc -n pulseops || true

          echo "========== INGRESS =========="
          kubectl get ingress -n pulseops || true

          echo "========== EVENTS =========="
          kubectl get events \
            -n pulseops \
            --sort-by=.lastTimestamp || true

          echo "========== BACKEND DESCRIPTION =========="
          kubectl describe deployment backend \
            -n pulseops || true

          echo "========== WORKER DESCRIPTION =========="
          kubectl describe deployment worker \
            -n pulseops || true

          echo "========== FRONTEND DESCRIPTION =========="
          kubectl describe deployment frontend \
            -n pulseops || true

          echo "========== BACKEND LOGS =========="
          kubectl logs \
            deployment/backend \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true

          echo "========== WORKER LOGS =========="
          kubectl logs \
            deployment/worker \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true

          echo "========== FRONTEND LOGS =========="
          kubectl logs \
            deployment/frontend \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true


