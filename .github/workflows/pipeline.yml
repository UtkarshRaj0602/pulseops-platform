      #     TOKEN=$(echo "$RESPONSE" | jq -r '.value')

      #     if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
      #       echo "Failed to obtain OIDC token"
      #       exit 1
      #     fi

      #     PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

      #     case $((${#PAYLOAD} % 4)) in
      #       2) PAYLOAD="${PAYLOAD}==" ;;
      #       3) PAYLOAD="${PAYLOAD}=" ;;
      #     esac

      #     echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
      #       iss,
      #       aud,
      #       sub,
      #       repository,
      #       repository_owner,
      #       repository_id,
      #       repository_owner_id,
      #       ref,
      #       ref_type,
      #       event_name
      #     }'

      - name: Inspect GitHub OIDC claims
        run: |
          echo "========== GITHUB CONTEXT =========="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref:        $GITHUB_REF"
          echo "Branch:     $GITHUB_REF_NAME"
          echo "Event:      $GITHUB_EVENT_NAME"
          echo "SHA:        $GITHUB_SHA"

          echo ""
          echo "========== OIDC TOKEN =========="

          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            ref_type,
            event_name
          }'

  ##############################################################3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

###########################Added forced terraform clean##########################
      - name: Clean Terraform
        run: |
          rm -rf .terraform
          rm -f .terraform.lock.hcl
          rm -rf ~/.terraform.d/plugin-cache

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate


######################################################

      - name: Verify Terraform Node Scaling Variables
        run: |
          echo "========== STAGE TFVARS =========="
          grep -E '^(desired_size|min_size|max_size)' \
            environments/stage/terraform.tfvars

          echo ""
          echo "========== TERRAFORM VARIABLE VALUES =========="
          terraform plan \
            -var-file="environments/stage/terraform.tfvars" \
            -target='module.eks' \
            -no-color | grep -A 15 -B 5 'aws_eks_node_group'
            
    # ==========================================
    # PHASE 1 - AWS INFRASTRUCTURE
    # ==========================================
      - name: Terraform Infrastructure Plan
        run: |
          terraform plan \
            -var-file="environments/stage/terraform.tfvars" \
            -target=module.vpc \
            -target=module.security \
            -target=module.iam \
            -target=module.ecr \
            -target=module.sqs \
            -target=module.secrets \
            -target=module.rds \
            -target=module.redis \
            -target=module.eks \
            -target=module.irsa \
            -out=stage-infrastructure.tfplan

      - name: Terraform Infrastructure Apply
        run: |
          terraform apply \
            -auto-approve \
            stage-infrastructure.tfplan

    # ==========================================
    # WAIT FOR EKS
    # ==========================================
      - name: Wait for EKS
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)

          echo "Waiting for EKS cluster: $CLUSTER_NAME"

          for i in {1..30}; do

            STATUS=$(aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query 'cluster.status' \
              --output text)

            echo "EKS status: $STATUS"

            if [ "$STATUS" = "ACTIVE" ]; then
              echo "EKS cluster is ACTIVE"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "EKS cluster did not become ACTIVE"
              exit 1
            fi

            sleep 20

          done

          # ==========================================
      # CONFIGURE KUBECTL
      # ==========================================

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)

          echo "Installing kubectl ${KUBECTL_VERSION}"

          curl -LO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Configure kubectl
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

      - name: Verify Kubernetes Access
        run: |
          kubectl cluster-info

    # ==========================================
      # PHASE 2A - HELM COMPONENTS
      # ==========================================

      - name: Terraform Helm Plan
        run: |
          terraform plan \
            -var-file="environments/stage/terraform.tfvars" \
            -target=module.helm \
            -out=stage-helm.tfplan

      - name: Terraform Helm Apply
        run: |
          terraform apply \
            -auto-approve \
            stage-helm.tfplan

      # ==========================================
      # PHASE 2B - KUBERNETES RESOURCES
      # ==========================================

      - name: Verify External Secrets CRDs
        run: |
          echo "Checking External Secrets CRDs..."

          for i in {1..30}; do
            if kubectl get crd secretstores.external-secrets.io >/dev/null 2>&1 && \
               kubectl get crd externalsecrets.external-secrets.io >/dev/null 2>&1; then
              echo "External Secrets CRDs are available."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "External Secrets CRDs were not created."
              kubectl get crd | grep external-secrets || true
              exit 1
            fi

            echo "Waiting for External Secrets CRDs... attempt $i/30"
            sleep 10
          done

      - name: Terraform Kubernetes Plan
        run: |
          terraform plan \
            -var-file="environments/stage/terraform.tfvars" \
            -out=stage-kubernetes.tfplan

      - name: Terraform Kubernetes Apply
        run: |
          terraform apply \
            -auto-approve \
            stage-kubernetes.tfplan

    # ==========================================
    # OUTPUTS
    # ==========================================
      - name: Get Terraform Outputs
        id: terraform-output
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)

          if [ -z "$CLUSTER_NAME" ]; then
            echo "EKS cluster name is empty"
            exit 1
          fi

          echo "EKS Cluster: $CLUSTER_NAME"
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"

# =========================================================
