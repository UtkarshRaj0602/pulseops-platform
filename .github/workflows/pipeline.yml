  # =========================================================
  # BACKEND #
  # =========================================================

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall app


  # =========================================================
  # WORKER
  # =========================================================

  worker:
    name: Worker Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/worker

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall .


  # =========================================================
  # FRONTEND
  # =========================================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build


  # =========================================================
  # DOCKER & ECR
  # =========================================================

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - terraform
      - backend
      - worker
      - frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR Registry
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      # - name: Build Backend Image
      #   run: |
      #     docker build \
      #       -t pulseops-stage-backend-api:$GITHUB_SHA \
      #       ./backend/api

      # - name: Build Worker Image
      #   run: |
      #     docker build \
      #       -t pulseops-stage-backend-worker:$GITHUB_SHA \
      #       ./backend/worker

      # - name: Build Frontend Image
      #   run: |
      #     docker build \
      #       -t pulseops-stage-frontend:$GITHUB_SHA \
      #       ./frontend

      # - name: Tag Backend Image
      #   run: |
      #     docker tag \
      #       pulseops-stage-backend-api:$GITHUB_SHA \
      #       $ECR_REGISTRY/pulseops-stage-backend:$GITHUB_SHA

      # - name: Tag Worker Image
      #   run: |
      #     docker tag \
      #       pulseops-stage-backend-worker:$GITHUB_SHA \
      #       $ECR_REGISTRY/pulseops-stage-worker:$GITHUB_SHA

      # - name: Tag Frontend Image
      #   run: |
      #     docker tag \
      #       pulseops-stage-frontend:$GITHUB_SHA \
      #       $ECR_REGISTRY/pulseops-stage-frontend:$GITHUB_SHA

      # - name: Push Backend Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-stage-backend:$GITHUB_SHA

      # - name: Push Worker Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-stage-worker:$GITHUB_SHA

      # - name: Push Frontend Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-stage-frontend:$GITHUB_SHA

      - name: Build Backend Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-stage-backend:${GITHUB_SHA}" \
            ./backend/api

      - name: Build Worker Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-stage-worker:${GITHUB_SHA}" \
            ./backend/worker

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-stage-frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Push Backend Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-stage-backend:${GITHUB_SHA}"

      - name: Push Worker Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-stage-worker:${GITHUB_SHA}"

      - name: Push Frontend Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-stage-frontend:${GITHUB_SHA}"

      - name: Display Image References
        run: |
          echo "Backend:"
          echo "$ECR_REGISTRY/pulseops-stage-backend:$GITHUB_SHA"

          echo "Worker:"
          echo "$ECR_REGISTRY/pulseops-stage-worker:$GITHUB_SHA"

          echo "Frontend:"
          echo "$ECR_REGISTRY/pulseops-stage-frontend:$GITHUB_SHA"

  # =========================================================
  # EKS DEPLOYMENT
  # =========================================================

  eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - terraform
      - docker

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # -------------------------------------------------------
      # AWS AUTHENTICATION
      # -------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------------------------------------
      # VERIFY AWS
      # -------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -------------------------------------------------------
      # GET EKS CLUSTER NAME
      # -------------------------------------------------------

      - name: Set EKS cluster name
        run: |
          echo "EKS_CLUSTER_NAME=${{ needs.terraform.outputs.cluster_name }}" >> "$GITHUB_ENV"

      - name: Verify EKS cluster
        run: |
          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "EKS_CLUSTER_NAME is empty"
            exit 1
          fi

          echo "EKS Cluster: $EKS_CLUSTER_NAME"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.{name:name,status:status,version:version}" \
            --output table


      # -------------------------------------------------------
      # INSTALL KUBECTL
      # -------------------------------------------------------

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)

          echo "Installing kubectl ${KUBECTL_VERSION}"

          curl -LO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

      - name: Verify kubectl
        run: |
          kubectl version --client


      # -------------------------------------------------------
      # CONFIGURE KUBECTL FOR EKS
      # -------------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      # -------------------------------------------------------
      # VERIFY EKS ACCESS
      # -------------------------------------------------------

      - name: Verify Kubernetes access
        run: |
          kubectl cluster-info

      - name: Get Kubernetes nodes
        run: |
          kubectl get nodes -o wide


      # -------------------------------------------------------
      # ENSURE PULSeOPS NAMESPACE EXISTS
      # -------------------------------------------------------

      - name: Ensure PulseOps Namespace
        run: |
          echo "========== CHECKING PULSeOPS NAMESPACE =========="

          if kubectl get namespace pulseops >/dev/null 2>&1; then
            echo "Namespace 'pulseops' already exists."
          else
            echo "Namespace 'pulseops' does not exist."
            echo "Creating namespace from manifest..."

            kubectl apply \
              -f infrastructure/kubernetes/namespace.yml
          fi

          echo ""
          echo "========== WAITING FOR NAMESPACE =========="

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Active \
            namespace/pulseops \
            --timeout=60s

          echo ""
          echo "========== NAMESPACE STATUS =========="

          kubectl get namespace pulseops


      # -------------------------------------------------------
      # APPLY KUBERNETES MANIFESTS
      # -------------------------------------------------------

      - name: Apply Kubernetes manifests
        run: |
          echo "========== APPLYING KUBERNETES MANIFESTS =========="

          kubectl apply \
            -f infrastructure/kubernetes/backend/

          kubectl apply \
            -f infrastructure/kubernetes/frontend/

          kubectl apply \
            -f infrastructure/kubernetes/worker/

          kubectl apply \
            -f infrastructure/kubernetes/ingress/

          echo ""
          echo "========== KUBERNETES RESOURCES =========="

          kubectl get all -n pulseops


      # -------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # -------------------------------------------------------

      - name: Update Backend Image
        run: |
          kubectl set image \
            "deployment/backend" \
            "backend=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-stage-backend:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # UPDATE WORKER IMAGE
      # -------------------------------------------------------

      - name: Update Worker Image
        run: |
          kubectl set image \
            "deployment/worker" \
            "worker=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-stage-worker:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # -------------------------------------------------------

      - name: Update Frontend Image
        run: |
          kubectl set image \
            "deployment/frontend" \
            "frontend=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-stage-frontend:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # VERIFY BACKEND ROLLOUT
      # -------------------------------------------------------

      # - name: Verify Backend Rollout
      #   run: |
      #     kubectl rollout status \
      #       deployment/backend \
      #       -n pulseops \
      #       --timeout=5m


      # -------------------------------------------------------
      # VERIFY WORKER ROLLOUT
      # -------------------------------------------------------

      # - name: Verify Worker Rollout
      #   run: |
      #     kubectl rollout status \
      #       deployment/worker \
      #       -n pulseops \
      #       --timeout=5m


      # -------------------------------------------------------
      # VERIFY FRONTEND ROLLOUT
      # -------------------------------------------------------

      # - name: Verify Frontend Rollout
      #   run: |
      #     kubectl rollout status \
      #       deployment/frontend \
