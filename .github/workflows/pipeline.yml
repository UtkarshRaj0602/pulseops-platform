      #       $ECR_REGISTRY/pulseops-backend:$GITHUB_SHA

      # - name: Tag Worker Image
      #   run: |
      #     docker tag \
      #       pulseops-backend-worker:$GITHUB_SHA \
      #       $ECR_REGISTRY/pulseops-worker:$GITHUB_SHA

      # - name: Tag Frontend Image
      #   run: |
      #     docker tag \
      #       pulseops-frontend:$GITHUB_SHA \
      #       $ECR_REGISTRY/pulseops-frontend:$GITHUB_SHA

      # - name: Push Backend Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-backend:$GITHUB_SHA

      # - name: Push Worker Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-worker:$GITHUB_SHA

      # - name: Push Frontend Image
      #   run: |
      #     docker push \
      #       $ECR_REGISTRY/pulseops-frontend:$GITHUB_SHA

      - name: Build Backend Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-backend:${GITHUB_SHA}" \
            ./backend/api

      - name: Build Worker Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-worker:${GITHUB_SHA}" \
            ./backend/worker

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/pulseops-frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Push Backend Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-backend:${GITHUB_SHA}"

      - name: Push Worker Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-worker:${GITHUB_SHA}"

      - name: Push Frontend Image
        run: |
          docker push \
            "${ECR_REGISTRY}/pulseops-frontend:${GITHUB_SHA}"

      - name: Display Image References
        run: |
          echo "Backend:"
          echo "$ECR_REGISTRY/pulseops-backend:$GITHUB_SHA"

          echo "Worker:"
          echo "$ECR_REGISTRY/pulseops-worker:$GITHUB_SHA"

          echo "Frontend:"
          echo "$ECR_REGISTRY/pulseops-frontend:$GITHUB_SHA"

  # =========================================================
  # EKS DEPLOYMENT
  # =========================================================

  eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - terraform
      - docker

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # -------------------------------------------------------
      # AWS AUTHENTICATION
      # -------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------------------------------------
      # VERIFY AWS
      # -------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -------------------------------------------------------
      # GET EKS CLUSTER NAME
      # -------------------------------------------------------

      - name: Set EKS cluster name
        run: |
          echo "EKS_CLUSTER_NAME=${{ needs.terraform.outputs.cluster_name }}" >> "$GITHUB_ENV"

      - name: Verify EKS cluster
        run: |
          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "EKS_CLUSTER_NAME is empty"
            exit 1
          fi

          echo "EKS Cluster: $EKS_CLUSTER_NAME"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.{name:name,status:status,version:version}" \
            --output table


      # -------------------------------------------------------
      # INSTALL KUBECTL
      # -------------------------------------------------------

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)

          echo "Installing kubectl ${KUBECTL_VERSION}"

          curl -LO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

      - name: Verify kubectl
        run: |
          kubectl version --client


      # -------------------------------------------------------
      # CONFIGURE KUBECTL FOR EKS
      # -------------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      # -------------------------------------------------------
      # VERIFY EKS ACCESS
      # -------------------------------------------------------

      - name: Verify Kubernetes access
        run: |
          kubectl cluster-info

      - name: Get Kubernetes nodes
        run: |
          kubectl get nodes -o wide


      # -------------------------------------------------------
      # APPLY KUBERNETES MANIFESTS
      # -------------------------------------------------------

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            --recursive \
            -f infrastructure/kubernetes/


      # -------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # -------------------------------------------------------

      - name: Update Backend Image
        run: |
          kubectl set image \
            "deployment/backend" \
            "backend=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-backend:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # UPDATE WORKER IMAGE
      # -------------------------------------------------------

      - name: Update Worker Image
        run: |
          kubectl set image \
            "deployment/worker" \
            "worker=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-worker:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # -------------------------------------------------------

      - name: Update Frontend Image
        run: |
          kubectl set image \
            "deployment/frontend" \
            "frontend=051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-frontend:${GITHUB_SHA}" \
            --namespace=pulseops


      # -------------------------------------------------------
      # VERIFY BACKEND ROLLOUT
      # -------------------------------------------------------

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            -n pulseops \
            --timeout=5m


      # -------------------------------------------------------
      # VERIFY WORKER ROLLOUT
      # -------------------------------------------------------

      - name: Verify Worker Rollout
        run: |
          kubectl rollout status \
            deployment/worker \
            -n pulseops \
            --timeout=5m


      # -------------------------------------------------------
      # VERIFY FRONTEND ROLLOUT
      # -------------------------------------------------------

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status \
            deployment/frontend \
            -n pulseops \
            --timeout=5m


      # -------------------------------------------------------
      # VERIFY PODS
      # -------------------------------------------------------

      - name: Verify Pods
        run: |
          kubectl get pods \
            -n pulseops \
            -o wide


      # -------------------------------------------------------
      # VERIFY SERVICES
      # -------------------------------------------------------

      - name: Verify Services
        run: |
          kubectl get svc \
            -n pulseops


      # -------------------------------------------------------
      # VERIFY INGRESS
      # -------------------------------------------------------

      - name: Verify Ingress
        run: |
          kubectl get ingress \
            -n pulseops


      # -------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # -------------------------------------------------------

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n pulseops -o wide || true

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n pulseops || true

          echo "========== SERVICES =========="
          kubectl get svc -n pulseops || true

          echo "========== INGRESS =========="
          kubectl get ingress -n pulseops || true

          echo "========== EVENTS =========="
          kubectl get events \
            -n pulseops \
            --sort-by=.lastTimestamp || true

          echo "========== BACKEND DESCRIPTION =========="
          kubectl describe deployment backend \
            -n pulseops || true

          echo "========== WORKER DESCRIPTION =========="
          kubectl describe deployment worker \
            -n pulseops || true

          echo "========== FRONTEND DESCRIPTION =========="
          kubectl describe deployment frontend \
            -n pulseops || true

          echo "========== BACKEND LOGS =========="
          kubectl logs \
            deployment/backend \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true

          echo "========== WORKER LOGS =========="
          kubectl logs \
            deployment/worker \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true

          echo "========== FRONTEND LOGS =========="
          kubectl logs \
            deployment/frontend \
            -n pulseops \
            --all-containers=true \
            --tail=100 || true


# -------------------------------------------------------
# END OF PIPELINE
# -------------------------------------------------------