apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: worker-hpa
  namespace: pulseops

  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: pulseops-platform
    app.kubernetes.io/managed-by: kubectl

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker

  minReplicas: 1
  maxReplicas: 5

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource

      resource:
        name: memory

        target:
          type: Utilization
          averageUtilization: 80

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 0

      policies:

        - type: Percent
          value: 100
          periodSeconds: 15

    scaleDown:

      stabilizationWindowSeconds: 300

      policies:

        - type: Percent
          value: 25
          periodSeconds: 60