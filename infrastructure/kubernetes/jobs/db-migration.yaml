apiVersion: batch/v1
kind: Job
metadata:
  name: pulseops-db-migration
  namespace: pulseops
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: pulseops-db-migration

    spec:
      restartPolicy: Never

      containers:
        - name: db-migration
          image: 051826706795.dkr.ecr.ap-south-1.amazonaws.com/pulseops-stage-backend:latest

          command:
            - alembic
            - upgrade
            - head

          envFrom:
            - secretRef:
                name: backend-secret